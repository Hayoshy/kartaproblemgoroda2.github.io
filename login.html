<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ВХОД</title>
  <link rel="icon" type="image/png" sizes="180x180" href="img/mini_logo.png">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main class="auth">
    <a class="logo-slot" href="index.html"><img src="img/logo.png" alt="На главную"></a>
    <h1 class="auth__title">Войдите в аккаунт</h1>
    <form class="form" id="login-form">
      <input class="field" type="text" name="username" placeholder="имя пользователя" autocomplete="username" aria-label="Имя пользователя" required>
      <input class="field" type="password" name="password" placeholder="пароль" autocomplete="current-password" aria-label="Пароль" required>
      <button class="btn" id="login-button" type="submit">Войти</button>
      <p class="auth-message" id="auth-message" role="status"></p>
    </form>
    <p class="auth__note">Если у вас нет аккаунта, то необходимо сперва <a href="register.html">зарегистрироваться</a></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script>
    const form = document.getElementById('login-form');
    const message = document.getElementById('auth-message');
    const button = document.getElementById('login-button');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      button.textContent = 'Входим…';
      message.className = 'auth-message';
      try {
        const { error } = await window.citySupabase.auth.signInWithPassword({
          email: window.usernameToEmail(form.elements.username.value),
          password: form.elements.password.value
        });
        if (error) throw error;
        message.textContent = 'Вход выполнен. Перенаправляем…';
        message.classList.add('success');
        setTimeout(() => location.href = 'index.html', 700);
      } catch (err) {
        message.textContent = window.ruError(err, 'Не удалось войти. Попробуйте ещё раз.');
        message.classList.add('error');
        button.disabled = false;
        button.textContent = 'Войти';
      }
    });
  </script>
</body>
</html>
